<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Counter Slot - ACEW</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>:root { --acew-maroon: #6b1d5c; } .bg-acew { background-color: var(--acew-maroon); }</style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-acew mb-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-arrow-left me-2"></i>Accounts Cash Counter Slot Booking</a>
        </div>
    </nav>
    <div class="container">
        <div class="card p-3 shadow-sm border-0">
            <h5 class="fw-bold text-acew mb-2"><i class="fa-solid fa-clock-rotate-left me-2"></i>Skip the Queue: Book Fee Payment Time Slot</h5>
            <p class="text-muted small">Select your preferred counter timing to complete tuition/exam fee payments without waiting.</p>

            <form id="slot-form">
                <div class="mb-2">
                    <label class="form-label fw-bold">Student Reg No</label>
                    <input type="text" id="regno" class="form-control" required placeholder="4944...">
                </div>
                <div class="mb-2">
                    <label class="form-label fw-bold">Purpose</label>
                    <select id="purpose" class="form-select">
                        <option>Exam Fee Payment</option>
                        <option>Tuition / Hostel Fee</option>
                        <option>Certificate / Bonafide Fee</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Time Slot</label>
                    <select id="timeslot" class="form-select">
                        <option>10:30 AM - 11:00 AM</option>
                        <option>11:30 AM - 12:00 PM</option>
                        <option>02:00 PM - 02:30 PM</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary fw-bold w-100">Confirm Counter Slot</button>
            </form>

            <div id="slot-ticket" class="mt-3"></div>
        </div>
    </div>

    <script>
        document.getElementById('slot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                regno: document.getElementById('regno').value,
                purpose: document.getElementById('purpose').value,
                timeslot: document.getElementById('timeslot').value
            };
            const res = await fetch('/api/book-slot', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            const d = await res.json();
            document.getElementById('slot-ticket').innerHTML = `
                <div class="alert alert-success text-center">
                    <h6 class="fw-bold m-0"><i class="fa-solid fa-ticket me-1"></i> ${d.message}</h6>
                    <small>Show Token at Counter 2 during ${body.timeslot}</small>
                </div>
            `;
        });
    </script>
</body>
</html>
