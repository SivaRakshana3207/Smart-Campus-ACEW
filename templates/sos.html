<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS Emergency - ACEW</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>:root { --acew-maroon: #6b1d5c; } .bg-acew { background-color: var(--acew-maroon); }</style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-acew mb-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-arrow-left me-2"></i>Campus Women Safety SOS Desk</a>
        </div>
    </nav>
    <div class="container text-center my-4">
        <div class="card p-4 shadow border-2 border-danger">
            <h3 class="fw-bold text-danger mb-3"><i class="fa-solid fa-triangle-exclamation me-2"></i>Emergency SOS Alert System</h3>
            <p class="text-muted">Tap the button below in case of any security, safety, or medical emergency within the college premises.</p>
            
            <button class="btn btn-danger btn-lg rounded-circle p-4 my-3 shadow-lg" style="width: 160px; height: 160px; font-weight: 800; font-size: 1.5rem;" onclick="triggerSOS()">
                EMERGENCY<br>SOS
            </button>

            <div id="sos-alert" class="mt-3"></div>
        </div>
    </div>

    <script>
        function triggerSOS() {
            if (confirm("Confirm dispatching emergency alert to Security Control Room and Hostel Warden?")) {
                document.getElementById('sos-alert').innerHTML = `
                    <div class="alert alert-danger fw-bold m-0">
                        <i class="fa-solid fa-bell fa-spin me-2"></i> EMERGENCY SIGNAL BROADCASTED! Security Control dispatched GPS Location coordinates.
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
