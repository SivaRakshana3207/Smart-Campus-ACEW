<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Court Pre-order - ACEW</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>:root { --acew-maroon: #6b1d5c; } .bg-acew { background-color: var(--acew-maroon); } .bottom-nav { display: none; } @media (max-width: 768px) { body { padding-bottom: 82px; } .bottom-nav { display: flex; position: fixed; z-index: 1000; bottom: 0; left: 0; right: 0; height: 70px; background: rgba(255,255,255,.94); backdrop-filter: blur(18px); border-top: 1px solid #eeeaf0; align-items: center; justify-content: space-around; padding: 5px 10px; } .bottom-item { flex: 1; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8d8790; font-size: 9px; font-weight: 700; text-decoration: none; } .bottom-item i { font-size: 17px; } .bottom-item.active { color: var(--acew-maroon); } .bottom-sos { width: 48px; height: 48px; margin-top: -22px; border-radius: 50%; background: #e53935; color: white; display: flex; align-items: center; justify-content: center; border: 5px solid #f7f7fa; box-shadow: 0 7px 20px rgba(229,57,53,.3); font-size: 17px; } }</style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-acew mb-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-arrow-left me-2"></i>Campus Cafeteria Mobile Orders</a>
        </div>
    </nav>
    <div class="container">
        <div class="card p-3 shadow-sm border-0 mb-3">
            <h5 class="fw-bold text-acew mb-3"><i class="fa-solid fa-utensils me-2"></i>Pre-order Snacks & Lunch</h5>
            <div class="list-group mb-3">
                <label class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <input class="form-check-input me-2" type="checkbox" value="Vegetable Biryani - ₹60" id="item1">
                        Vegetable Biryani
                    </div>
                    <span class="fw-bold">₹60</span>
                </label>
                <label class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <input class="form-check-input me-2" type="checkbox" value="Samosa (2 pcs) - ₹20" id="item2">
                        Samosa (2 Pcs)
                    </div>
                    <span class="fw-bold">₹20</span>
                </label>
                <label class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <input class="form-check-input me-2" type="checkbox" value="Fresh Fruit Juice - ₹30" id="item3">
                        Fresh Fruit Juice
                    </div>
                    <span class="fw-bold">₹30</span>
                </label>
            </div>
            <button class="btn btn-warning fw-bold text-dark w-100" onclick="orderFood()"><i class="fa-solid fa-bag-shopping me-1"></i> Place Order & Pay at Counter</button>
        </div>
        <div id="food-status"></div>
    </div>

    <script>
        async function orderFood() {
            const items = [];
            if(document.getElementById('item1').checked) items.push("Veg Biryani");
            if(document.getElementById('item2').checked) items.push("Samosa");
            if(document.getElementById('item3').checked) items.push("Fruit Juice");

            if(items.length === 0) { alert("Select at least one food item!"); return; }

            const res = await fetch('/api/food/order', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ items: items })
            });
            const d = await res.json();
            document.getElementById('food-status').innerHTML = `
                <div class="alert alert-success text-center">
                    <h6 class="fw-bold"><i class="fa-solid fa-circle-check me-1"></i> Order Placed! Token ID: ${d.order_id}</h6>
                    <small>Collect at Cafeteria Express Counter in 10 minutes.</small>
                </div>
            `;
        }
    </script>
    <nav class="bottom-nav"><a href="/" class="bottom-item"><i class="fa-solid fa-house"></i>Home</a><a href="/announce" class="bottom-item"><i class="fa-solid fa-bullhorn"></i>Updates</a><a href="/sos" class="bottom-item"><span class="bottom-sos"><i class="fa-solid fa-shield-halved"></i></span>SOS</a><a href="/virtual" class="bottom-item"><i class="fa-solid fa-location-arrow"></i>Navigate</a><a href="/ai-notes" class="bottom-item"><i class="fa-solid fa-brain"></i>AI</a></nav>
</body>
</html>
