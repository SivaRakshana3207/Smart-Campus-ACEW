<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Court Pre-order - ACEW</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>:root { --acew-maroon: #6b1d5c; } .bg-acew { background-color: var(--acew-maroon); }</style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-acew mb-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-arrow-left me-2"></i>Campus Cafeteria Mobile Orders</a>
        </div>
    </nav>
    <div class="container">
        <div class="card p-3 shadow-sm border-0 mb-3">
            <h5 class="fw-bold text-acew mb-3"><i class="fa-solid fa-utensils me-2"></i>Pre-order Snacks & Lunch</h5>
            <div class="list-group mb-3">
                <label class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <input class="form-check-input me-2" type="checkbox" value="Vegetable Biryani - ₹60" id="item1">
                        Vegetable Biryani
                    </div>
                    <span class="fw-bold">₹60</span>
                </label>
                <label class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <input class="form-check-input me-2" type="checkbox" value="Samosa (2 pcs) - ₹20" id="item2">
                        Samosa (2 Pcs)
                    </div>
                    <span class="fw-bold">₹20</span>
                </label>
                <label class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <input class="form-check-input me-2" type="checkbox" value="Fresh Fruit Juice - ₹30" id="item3">
                        Fresh Fruit Juice
                    </div>
                    <span class="fw-bold">₹30</span>
                </label>
            </div>
            <button class="btn btn-warning fw-bold text-dark w-100" onclick="orderFood()"><i class="fa-solid fa-bag-shopping me-1"></i> Place Order & Pay at Counter</button>
        </div>
        <div id="food-status"></div>
    </div>

    <script>
        async function orderFood() {
            const items = [];
            if(document.getElementById('item1').checked) items.push("Veg Biryani");
            if(document.getElementById('item2').checked) items.push("Samosa");
            if(document.getElementById('item3').checked) items.push("Fruit Juice");

            if(items.length === 0) { alert("Select at least one food item!"); return; }

            const res = await fetch('/api/food/order', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ items: items })
            });
            const d = await res.json();
            document.getElementById('food-status').innerHTML = `
                <div class="alert alert-success text-center">
                    <h6 class="fw-bold"><i class="fa-solid fa-circle-check me-1"></i> Order Placed! Token ID: ${d.order_id}</h6>
                    <small>Collect at Cafeteria Express Counter in 10 minutes.</small>
                </div>
            `;
        }
    </script>
</body>
</html>
