<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ACEW</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>:root { --acew-maroon: #6b1d5c; } .bg-acew { background-color: var(--acew-maroon); } .bottom-nav { display: none; } @media (max-width: 768px) { body { padding-bottom: 82px; } .bottom-nav { display: flex; position: fixed; z-index: 1000; bottom: 0; left: 0; right: 0; height: 70px; background: rgba(255,255,255,.94); backdrop-filter: blur(18px); border-top: 1px solid #eeeaf0; align-items: center; justify-content: space-around; padding: 5px 10px; } .bottom-item { flex: 1; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8d8790; font-size: 9px; font-weight: 700; text-decoration: none; } .bottom-item i { font-size: 17px; } .bottom-item.active { color: var(--acew-maroon); } .bottom-sos { width: 48px; height: 48px; margin-top: -22px; border-radius: 50%; background: #e53935; color: white; display: flex; align-items: center; justify-content: center; border: 5px solid #f7f7fa; box-shadow: 0 7px 20px rgba(229,57,53,.3); font-size: 17px; } }</style>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#6b1d5c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/static/icon.svg">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-acew mb-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-graduation-cap me-2"></i>ACEW Admin Management Dashboard</a>
            <button class="btn btn-outline-light btn-sm fw-bold" onclick="logout()"><i class="fa-solid fa-right-from-bracket me-1"></i> Logout</button>
        </div>
    </nav>

    <div class="container">
        <!-- Post New Announcement Card -->
        <div class="card p-3 shadow-sm border-0 mb-4">
            <h5 class="fw-bold text-acew mb-2"><i class="fa-solid fa-plus-circle me-2"></i>Post Official Campus Announcement</h5>
            <form id="post-announce-form">
                <div class="mb-2">
                    <label class="form-label fw-bold">Title</label>
                    <input type="text" id="ann_title" class="form-control" required placeholder="e.g. End Semester Exam Timetable">
                </div>
                <div class="mb-2">
                    <label class="form-label fw-bold">Category</label>
                    <select id="ann_cat" class="form-select">
                        <option>Academic</option>
                        <option>Hostel</option>
                        <option>Transport</option>
                        <option>Placement</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Message / Details</label>
                    <textarea id="ann_msg" class="form-control" rows="2" required></textarea>
                </div>
                <button type="submit" class="btn btn-success fw-bold w-100">Publish Announcement to All Students</button>
            </form>
        </div>

        <!-- Student Requests Tables -->
        <h5 class="fw-bold text-acew mb-3"><i class="fa-solid fa-database me-2"></i>Student Submissions stored in SQLite DB</h5>

        <div class="accordion shadow-sm" id="adminAccordion">
            <!-- Outpasses -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne">
                        <i class="fa-solid fa-id-card me-2"></i> Submitted Hostel Outpasses
                    </button>
                </h2>
                <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#adminAccordion">
                    <div class="accordion-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light"><tr><th>Pass ID</th><th>Name</th><th>Dept</th><th>Reason</th><th>Status</th></tr></thead>
                                <tbody id="admin-outpass-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Cash Slots -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo">
                        <i class="fa-solid fa-clock me-2"></i> Cash Counter Booked Slots
                    </button>
                </h2>
                <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#adminAccordion">
                    <div class="accordion-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light"><tr><th>Token</th><th>Reg No</th><th>Purpose</th><th>Slot Time</th></tr></thead>
                                <tbody id="admin-slot-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Food Orders -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#collapseThree">
                        <i class="fa-solid fa-utensils me-2"></i> Cafeteria Pre-Orders
                    </button>
                </h2>
                <div id="collapseThree" class="accordion-collapse collapse" data-bs-parent="#adminAccordion">
                    <div class="accordion-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light"><tr><th>Order ID</th><th>Items</th><th>Status</th></tr></thead>
                                <tbody id="admin-food-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="/" class="bottom-item"><i class="fa-solid fa-house"></i>Home</a>
        <a href="/announce" class="bottom-item"><i class="fa-solid fa-bullhorn"></i>Updates</a>
        <a href="/sos" class="bottom-item"><span class="bottom-sos"><i class="fa-solid fa-shield-halved"></i></span>SOS</a>
        <a href="/virtual" class="bottom-item"><i class="fa-solid fa-location-arrow"></i>Navigate</a>
        <a href="/ai-notes" class="bottom-item"><i class="fa-solid fa-brain"></i>AI</a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Post Announcement
        document.getElementById('post-announce-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                title: document.getElementById('ann_title').value,
                category: document.getElementById('ann_cat').value,
                msg: document.getElementById('ann_msg').value
            };
            const res = await fetch('/api/announcements/add', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            const d = await res.json();
            alert(d.message);
            document.getElementById('post-announce-form').reset();
        });

        // Load DB Submissions for Admin View
        async function loadAdminData() {
            // Outpasses
            const resOut = await fetch('/api/outpass/list');
            const dataOut = await resOut.json();
            document.getElementById('admin-outpass-body').innerHTML = dataOut.data.map(o => `
                <tr><td><strong>${o.pass_id}</strong></td><td>${o.name}</td><td>${o.dept}</td><td>${o.reason}</td><td><span class="badge bg-success">${o.status}</span></td></tr>
            `).join('');

            // Slots
            const resSlot = await fetch('/api/slots/list');
            const dataSlot = await resSlot.json();
            document.getElementById('admin-slot-body').innerHTML = dataSlot.data.map(s => `
                <tr><td><strong>${s.token}</strong></td><td>${s.regno}</td><td>${s.purpose}</td><td>${s.timeslot}</td></tr>
            `).join('');

            // Food Orders
            const resFood = await fetch('/api/food/list');
            const dataFood = await resFood.json();
            document.getElementById('admin-food-body').innerHTML = dataFood.data.map(f => `
                <tr><td><strong>${f.order_id}</strong></td><td>${f.items}</td><td><span class="badge bg-warning text-dark">${f.status}</span></td></tr>
            `).join('');
        }

        async function logout() {
            await fetch('/api/logout');
            window.location.href = '/';
        }

        loadAdminData();
    </script>
</body>
    <script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js'));</script>
</html>
