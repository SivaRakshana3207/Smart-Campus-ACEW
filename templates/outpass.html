<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Outpass - ACEW</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>:root { --acew-maroon: #6b1d5c; } .bg-acew { background-color: var(--acew-maroon); }</style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-acew mb-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-arrow-left me-2"></i>Seetha Lakshmi Hostel Outpass</a>
        </div>
    </nav>
    <div class="container">
        <div class="card p-3 shadow-sm border-0 mb-3">
            <h5 class="fw-bold text-acew mb-3"><i class="fa-solid fa-file-pen me-2"></i>Apply Digital Leave Outpass</h5>
            <form id="outpass-form">
                <div class="mb-2">
                    <label class="form-label fw-bold">Student Name</label>
                    <input type="text" id="name" class="form-control" required placeholder="e.g. Kavya R">
                </div>
                <div class="mb-2">
                    <label class="form-label fw-bold">Department</label>
                    <select id="dept" class="form-select">
                        <option>B.Tech AI & DS</option>
                        <option>B.E CSE</option>
                        <option>B.E ECE</option>
                        <option>B.E EEE</option>
                        <option>B.Tech IT</option>
                        <option>B.E Civil</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Reason for Outpass</label>
                    <input type="text" id="reason" class="form-control" required placeholder="Home visit / Medical">
                </div>
                <button type="submit" class="btn btn-success fw-bold w-100">Submit Application</button>
            </form>
        </div>

        <div class="card p-3 shadow-sm border-0">
            <h5 class="fw-bold text-acew mb-2">My Approved Passes</h5>
            <div id="pass-list"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('outpass-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                name: document.getElementById('name').value,
                dept: document.getElementById('dept').value,
                reason: document.getElementById('reason').value
            };
            const res = await fetch('/api/outpass/apply', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            const d = await res.json();
            alert(`Pass Generated Successfully! ID: ${d.outpass_id}`);
            loadPasses();
        });

        async function loadPasses() {
            const res = await fetch('/api/outpass/list');
            const data = await res.json();
            document.getElementById('pass-list').innerHTML = data.data.map(p => `
                <div class="p-2 border-bottom">
                    <strong class="text-dark">${p.id} - ${p.name}</strong> (${p.dept})<br>
                    <small class="text-muted">Reason: ${p.reason}</small> <span class="badge bg-success ms-2">${p.status}</span>
                </div>
            `).join('');
        }
        loadPasses();
    </script>
</body>
</html>
