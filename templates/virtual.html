<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual AI Guidance - ACEW</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- TensorFlow.js & COCO-SSD Model -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>:root { --acew-maroon: #6b1d5c; } .bg-acew { background-color: var(--acew-maroon); }</style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-acew mb-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-arrow-left me-2"></i>Visual AI Camera Guidance</a>
        </div>
    </nav>
    <div class="container text-center">
        <div class="card p-3 shadow-sm border-0">
            <h5 class="fw-bold text-acew"><i class="fa-solid fa-camera me-2"></i>Real-Time Campus Object & Path Detection</h5>
            <p class="text-muted small">Uses device camera + TensorFlow.js to assist visually impaired students with path obstacles.</p>
            
            <div class="position-relative d-inline-block my-2">
                <video id="video" autoplay playsinline muted class="border rounded w-100" style="max-width: 480px; height: auto;"></video>
            </div>

            <div>
                <button class="btn btn-primary fw-bold" id="start-cam-btn"><i class="fa-solid fa-power-off me-1"></i> Start Camera & AI Scanner</button>
            </div>
            <div id="detection-result" class="mt-3 alert alert-info fw-bold">Camera status: Idle</div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const startBtn = document.getElementById('start-cam-btn');
        const resultDiv = document.getElementById('detection-result');

        startBtn.addEventListener('click', async () => {
            resultDiv.innerText = "Loading AI TensorFlow Model...";
            const model = await cocoSsd.load();
            
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;

            video.onloadeddata = () => {
                resultDiv.innerText = "AI Scanning Active! Analyzing camera frame...";
                setInterval(async () => {
                    const predictions = await model.detect(video);
                    if (predictions.length > 0) {
                        const items = predictions.map(p => `${p.class} (${Math.round(p.score * 100)}%)`).join(', ');
                        resultDiv.innerText = `Detected Objects ahead: ${items}`;
                    } else {
                        resultDiv.innerText = "Path clear. No obstacle detected.";
                    }
                }, 2000);
            };
        });
    </script>
</body>
</html>
