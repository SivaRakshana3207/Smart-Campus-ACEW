<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual AI Guidance - ACEW</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- TensorFlow.js & COCO-SSD Model -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>:root { --acew-maroon: #6b1d5c; } .bg-acew { background-color: var(--acew-maroon); } .bottom-nav { display: none; } @media (max-width: 768px) { body { padding-bottom: 82px; } .bottom-nav { display: flex; position: fixed; z-index: 1000; bottom: 0; left: 0; right: 0; height: 70px; background: rgba(255,255,255,.94); backdrop-filter: blur(18px); border-top: 1px solid #eeeaf0; align-items: center; justify-content: space-around; padding: 5px 10px; } .bottom-item { flex: 1; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8d8790; font-size: 9px; font-weight: 700; text-decoration: none; } .bottom-item i { font-size: 17px; } .bottom-item.active { color: var(--acew-maroon); } .bottom-sos { width: 48px; height: 48px; margin-top: -22px; border-radius: 50%; background: #e53935; color: white; display: flex; align-items: center; justify-content: center; border: 5px solid #f7f7fa; box-shadow: 0 7px 20px rgba(229,57,53,.3); font-size: 17px; } }</style>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#6b1d5c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/static/icon.svg">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-acew mb-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-arrow-left me-2"></i>Visual AI Camera Guidance</a>
        </div>
    </nav>
    <div class="container text-center">
        <div class="card p-3 shadow-sm border-0">
            <h5 class="fw-bold text-acew"><i class="fa-solid fa-camera me-2"></i>Real-Time Campus Object & Path Detection</h5>
            <p class="text-muted small">Uses device camera + TensorFlow.js to assist visually impaired students with path obstacles.</p>
            
            <div class="position-relative d-inline-block my-2">
                <video id="video" autoplay playsinline muted class="border rounded w-100" style="max-width: 480px; height: auto;"></video>
            </div>

            <div>
                <button class="btn btn-primary fw-bold" id="start-cam-btn"><i class="fa-solid fa-power-off me-1"></i> Start Camera & AI Scanner</button>
            </div>
            <div id="detection-result" class="mt-3 alert alert-info fw-bold">Camera status: Idle</div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const startBtn = document.getElementById('start-cam-btn');
        const resultDiv = document.getElementById('detection-result');

        startBtn.addEventListener('click', async () => {
            resultDiv.innerText = "Loading AI TensorFlow Model...";
            const model = await cocoSsd.load();
            
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;

            video.onloadeddata = () => {
                resultDiv.innerText = "AI Scanning Active! Analyzing camera frame...";
                setInterval(async () => {
                    const predictions = await model.detect(video);
                    if (predictions.length > 0) {
                        const items = predictions.map(p => `${p.class} (${Math.round(p.score * 100)}%)`).join(', ');
                        resultDiv.innerText = `Detected Objects ahead: ${items}`;
                    } else {
                        resultDiv.innerText = "Path clear. No obstacle detected.";
                    }
                }, 2000);
            };
        });
    </script>
    <nav class="bottom-nav"><a href="/" class="bottom-item"><i class="fa-solid fa-house"></i>Home</a><a href="/announce" class="bottom-item"><i class="fa-solid fa-bullhorn"></i>Updates</a><a href="/sos" class="bottom-item"><span class="bottom-sos"><i class="fa-solid fa-shield-halved"></i></span>SOS</a><a href="/virtual" class="bottom-item active"><i class="fa-solid fa-location-arrow"></i>Navigate</a><a href="/ai-notes" class="bottom-item"><i class="fa-solid fa-brain"></i>AI</a></nav>
</body>
    <script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js'));</script>
</html>
